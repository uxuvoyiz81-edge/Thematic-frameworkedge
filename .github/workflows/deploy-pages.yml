name: 📄 部署到 GitHub Pages

on:
  push:
    branches: [ main ]
    paths:
      - 'index.html'
      - 'index_fixed-1.html'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 准备发布目录
        run: |
          mkdir -p dist
          if [ -f index.html ]; then
            cp index.html dist/index.html
          else
            cp index_fixed-1.html dist/index.html
          fi
          [ -f ads.txt ] && cp ads.txt dist/ || true
          touch dist/.nojekyll

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 上传产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
